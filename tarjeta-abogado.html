<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lic. Tejada – Abogado</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #b8975a;
      --gold-light: #d4b07a;
      --gold-dark: #8a6e3e;
      --dark2: #161616;
      --dark3: #1e1e1e;
      --cream: #f5efe6;
      --text-muted: #7a7060;
    }

    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Jost', sans-serif;
      padding: 2rem 1rem;
      gap: 2rem;
    }

    .scene {
      -webkit-perspective: 1200px;
      perspective: 1200px;
      width: min(420px, 92vw);
      height: min(240px, 54vw);
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
      transition: -webkit-transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-inner.flipped {
      -webkit-transform: rotateY(180deg);
      transform: rotateY(180deg);
    }

    /* Ambas caras comparten estas reglas base */
    .front, .back {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      overflow: hidden;
    }

    /* ── FRENTE ── */
    .front {
      background: var(--dark2);
      border: 1px solid rgba(184,151,90,0.25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(20px, 5vw, 32px);
      -webkit-transform: rotateY(0deg) translateZ(1px);
      transform: rotateY(0deg) translateZ(1px);
    }

    .front::before, .front::after {
      content: '';
      position: absolute;
      width: 28px; height: 28px;
      border-color: var(--gold);
      border-style: solid;
    }
    .front::before { top: 14px; left: 14px; border-width: 1px 0 0 1px; }
    .front::after  { bottom: 14px; right: 14px; border-width: 0 1px 1px 0; }

    .gold-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }

    .seal {
      width: clamp(36px, 8vw, 48px);
      height: clamp(36px, 8vw, 48px);
      border: 1px solid rgba(184,151,90,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(12px, 2.5vw, 16px);
      color: var(--gold);
      flex-shrink: 0;
    }

    .specialties {
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .spec-tag {
      font-size: clamp(7px, 1.5vw, 9px);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 300;
    }

    .middle { position: relative; z-index: 1; }

    .divider {
      width: 28px; height: 1px;
      background: var(--gold);
      margin-bottom: 8px;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 600;
      color: var(--cream);
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .title {
      font-size: clamp(7px, 1.8vw, 10px);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      margin-top: 5px;
    }

    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
      z-index: 1;
    }

    .contact-info { display: flex; flex-direction: column; gap: 4px; }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(8px, 1.8vw, 11px);
      color: rgba(245,239,230,0.55);
      font-weight: 300;
      letter-spacing: 0.3px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .contact-item:hover { color: var(--gold-light); }
    .contact-item svg {
      width: clamp(10px, 2vw, 13px);
      height: clamp(10px, 2vw, 13px);
      stroke: var(--gold-dark);
      flex-shrink: 0;
    }

    .ornament {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(28px, 6vw, 40px);
      color: rgba(184,151,90,0.06);
      line-height: 1;
      user-select: none;
      font-weight: 700;
    }

    /* ── REVERSO ── */
    .back {
      background: var(--dark3);
      border: 1px solid rgba(184,151,90,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      -webkit-transform: rotateY(180deg) translateZ(1px);
      transform: rotateY(180deg) translateZ(1px);
    }

    .back::before, .back::after {
      content: '';
      position: absolute;
      width: 28px; height: 28px;
      border-color: rgba(184,151,90,0.3);
      border-style: solid;
    }
    .back::before { top: 14px; left: 14px; border-width: 1px 0 0 1px; }
    .back::after  { bottom: 14px; right: 14px; border-width: 0 1px 1px 0; }

    .back-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(22px, 5.5vw, 36px);
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 6px;
      line-height: 1;
    }

    .back-line {
      width: 40px; height: 1px;
      background: rgba(184,151,90,0.4);
    }

    .back-tagline {
      font-family: 'Jost', sans-serif;
      font-size: clamp(6px, 1.3vw, 8px);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .hint {
      font-size: 11px;
      color: rgba(122,112,96,0.6);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
    }

    .cta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .cta-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 20px;
      border-radius: 6px;
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      font-weight: 400;
      transition: all 0.25s;
      cursor: pointer;
    }

    .cta-btn svg {
      width: 15px; height: 15px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-gold {
      background: rgba(184,151,90,0.12);
      border: 1px solid rgba(184,151,90,0.4);
      color: var(--gold-light);
    }
    .btn-gold:hover { background: rgba(184,151,90,0.22); border-color: var(--gold); }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(245,239,230,0.1);
      color: rgba(245,239,230,0.45);
    }
    .btn-outline:hover { border-color: rgba(245,239,230,0.25); color: rgba(245,239,230,0.7); }

    @media (max-width: 480px) {
      body { padding: 1.5rem 1rem; gap: 1.5rem; }
      .cta-btn { padding: 9px 15px; font-size: 11px; }
    }
  </style>
</head>
<body>

  <div class="scene" onclick="toggleFlip()">
    <div class="card-inner" id="card">

      <!-- FRENTE -->
      <div class="front">
        <div class="gold-bar"></div>
        <div class="top-row">
          <div class="seal">⚖</div>
          <div class="specialties">
            <span class="spec-tag">Derecho Civil</span>
            <span class="spec-tag">Derecho Familiar</span>
            <span class="spec-tag">Derecho Mercantil</span>
          </div>
        </div>
        <div class="middle">
          <div class="divider"></div>
          <div class="name">Lic. Jose Antonio Tejada Gálvez</div>
          <div class="title">Abogado &amp; Consultor Jurídico</div>
        </div>
        <div class="bottom-row">
          <div class="contact-info">
            <a class="contact-item" href="tel:+525517985370">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012 1h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 15v1.92z"/></svg>
              +52 55 1798 5370
            </a>
            <a class="contact-item" href="mailto:tejada.xml@hotmail.com">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              tejada.xml@hotmail.com
            </a>
            <a class="contact-item" href="#">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              CDMX
            </a>
          </div>
          <div class="ornament">§</div>
        </div>
      </div>

      <!-- REVERSO -->
      <div class="back">
        <div class="back-logo">JTG</div>
        <div class="back-line"></div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="rgba(184,151,90,0.5)" stroke-width="1"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="3" x2="12" y2="21"/>
          <path d="M3 9l9-6 9 6"/>
          <path d="M6 12l-3 6h6l-3-6z"/>
          <path d="M18 12l-3 6h6l-3-6z"/>
          <line x1="5" y1="21" x2="19" y2="21"/>
        </svg>
        <div class="back-tagline">Lic. Jose Antonio Tejada</div>
      </div>

    </div>
  </div>

  <p class="hint">Toca la tarjeta para girarla</p>

  <div class="cta-row">
    <a class="cta-btn btn-gold" href="https://wa.me/525517985370">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      WhatsApp
    </a>
    <a class="cta-btn btn-gold" href="mailto:tejada.xml@hotmail.com">
      <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      Correo
    </a>
    <a class="cta-btn btn-outline" href="tel:+525517985370">
      <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012 1h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 15v1.92z"/></svg>
      Llamar
    </a>
  </div>

  <script>
    const card = document.getElementById('card');

    function toggleFlip() {
      card.style.transform = '';
      card.style.webkitTransform = '';
      card.classList.toggle('flipped');
    }

    const scene = document.querySelector('.scene');
    let isTouching = false;

    scene.addEventListener('touchstart', () => { isTouching = true; }, { passive: true });

    scene.addEventListener('mousemove', (e) => {
      if (isTouching || card.classList.contains('flipped')) return;
      const { left, top, width, height } = scene.getBoundingClientRect();
      const x = ((e.clientX - left) / width - 0.5) * 12;
      const y = ((e.clientY - top) / height - 0.5) * -10;
      card.style.transform = `rotateY(${x}deg) rotateX(${y}deg) scale(1.02)`;
    });

    scene.addEventListener('mouseleave', () => {
      if (!card.classList.contains('flipped')) {
        card.style.transform = '';
      }
    });
  </script>
</body>
</html>
